name: Build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing v* tag to publish (leave empty for a build only)"
        required: false
        type: string
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validate Maven project
        working-directory: my-jira-gadget
        run: mvn -B -ntp validate

      - name: Lint XML descriptors
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libxml2-utils
          xmllint --noout \
            my-jira-gadget/pom.xml \
            my-jira-gadget/src/main/resources/atlassian-plugin.xml \
            my-jira-gadget/src/main/resources/gadget/my-gadget.xml \
            my-jira-gadget/src/main/resources/META-INF/spring/plugin-context.xml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint gadget JavaScript
        run: |
          python3 - <<'PY'
          import pathlib
          import re

          xml = pathlib.Path("my-jira-gadget/src/main/resources/gadget/my-gadget.xml").read_text()
          scripts = re.findall(r"<script>(.*?)</script>", xml, re.S)
          if not scripts:
              raise SystemExit("No <script> block found in gadget XML")
          pathlib.Path("gadget.js").write_text("\n".join(scripts))
          PY
          node --check gadget.js

      - name: Smoke test gadget JavaScript
        run: node tests/gadget-smoke-test.js

      - name: Run Checkstyle
        working-directory: my-jira-gadget
        run: >
          mvn -B -ntp org.apache.maven.plugins:maven-checkstyle-plugin:3.3.1:check
          -Dcheckstyle.config.location=google_checks.xml

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: my-jira-gadget/target/checkstyle-result.xml
          if-no-files-found: ignore

  security:
    name: Security scan
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Scan dependencies and secrets with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: table
          exit-code: "1"

  build:
    name: Build plugin
    needs: [lint, security]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Set release version
        if: env.RELEASE_TAG != ''
        working-directory: my-jira-gadget
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          if [[ ! "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          mvn -B -ntp org.codehaus.mojo:versions-maven-plugin:2.23.0:set \
            -DnewVersion="$release_version" \
            -DgenerateBackupPoms=false

      - name: Build plugin
        working-directory: my-jira-gadget
        run: mvn -B -ntp package

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sprint-pulse-plugin
          path: |
            my-jira-gadget/target/sprint-pulse-*.jar
            my-jira-gadget/target/sprint-pulse-*.obr
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download plugin artifacts
        uses: actions/download-artifact@v4
        with:
          name: sprint-pulse-plugin
          path: release-assets

      - name: Attach JAR to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release-assets/*.jar --clobber
